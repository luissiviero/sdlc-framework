# The project's eval suite (build guide step 35; decision 17; article p.29-31: "a suite that
# runs whenever the agent's configuration changes ... non-interactively in CI on a schedule
# and on any change to CLAUDE.md, skills or hooks"; p.30 step 4 "Gate configuration changes
# on the results").
#
# Contract: docs/OPERATING_MODEL.md section 4.2. Installed into this project by /sdlc-init
# from the framework's template/.github/workflows/; edit it here, not in the framework.
#
# What one run does: evals/check.py hands the suite to the pinned framework's runner
# (plugin/evals/run.py), which runs every case of evals/cases/ in a copy of this checkout
# with the project's CLAUDE.md, hooks and settings in force, applies the case's checks in
# Python and exits non-zero when the pass rate is below the threshold - the red check on a
# pull request that changes the agent's configuration is the gate the article asks for. The
# suite starts empty (decision 17) and fills from incidents: an empty suite is a green job.
# The report is an artifact; nothing is committed and nobody is notified.
#
# Token rule: events caused by this workflow's GITHUB_TOKEN never start another workflow run.
# This workflow starts nothing and writes nothing.
#
# Schedule note: cron is UTC, runs on the default branch, and an off-the-hour minute is less
# delayed than :00. GitHub disables schedules in a public repository after 60 days without
# activity; the workflow_dispatch trigger is how the owner re-enables it.
#
# /sdlc-init rewrote `branches: [main]` below to this project's default branch and filled
# in the framework repository. The Claude Code version is read from sdlc.yaml at run time.
name: SDLC evals

on:
  pull_request:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - ".claude/**"
      - "evals/**"
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "sdlc-evals-${{ github.event.pull_request.head.ref || github.ref }}"
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml
        id: pin
        env:
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/sdlc_pin.py --ref "origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@v5
        with:
          repository: "{{FRAMEWORK_REPO}}"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pin.outputs.claude_code }}
        run: npm install -g @anthropic-ai/claude-code@"$CLAUDE_CODE_VERSION"

      - name: "Install the project's own toolchain (sdlc.yaml: commands.setup)"
        run: python framework/plugin/ci/project_setup.py --root .

      # The runner never adds --bare: the suite tests CLAUDE.md, the hooks and the settings,
      # which bare mode skips. Print mode uses the API key when present, else the OAuth token.
      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python evals/check.py --framework framework --report evals-report.json

      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-evals-report-${{ github.run_id }}
          path: evals-report.json
          if-no-files-found: ignore
