# The framework-level eval suite (build guide step 35; article p.30: a suite "that runs
# whenever the agent's configuration changes"): this repository's evals/cases/ run against a
# fixture project initialised with the plugin of the checkout, on every pull request that
# changes the plugin and nightly. Not a template: a project gets sdlc-agent-evals.yml instead.
#
# plugin/evals/run.py --fixture copies tests/fixtures/sample-python-project to a temporary
# directory, runs /sdlc-init on it with this checkout as the plugin, and runs each case there
# with the project's CLAUDE.md, hooks and settings in force (never --bare), sandboxed as a CI
# session is: the phase jobs' runner setup step installs bubblewrap first, so the fixture's
# sandbox block takes effect and case 0006 proves denyWrite live (ROADMAP R44, point 1). The
# pass rate is the job's verdict; the report is an artifact. Nothing is committed, nobody is
# notified.
name: Framework evals

on:
  pull_request:
    branches: [main]
    paths:
      - "plugin/**"
      - "template/**"
      - "evals/**"
  schedule:
    - cron: "52 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's runs are keyed by its number (two forks' branches of one name never
  # share a group), and a new push cancels the paid run it supersedes, whose verdict would
  # judge a head nobody merges. The nightly and dispatched runs are keyed by their commit and
  # never cancelled (the batch ci revision, 10.8).
  group: "framework-evals-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.278

      - name: Prepare the runner for Claude Code's sandbox
        run: python plugin/ci/runner_setup.py

      - name: Install the fixture's toolchain
        run: python -m pip install pytest ruff

      - name: Run the framework eval suite against the initialised fixture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python plugin/evals/run.py --fixture --report evals-report.json

      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: framework-evals-report-${{ github.run_id }}
          path: evals-report.json
          if-no-files-found: ignore
