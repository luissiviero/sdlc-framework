# First proof of the execution substrate (build guide step 3, decision 1; step 30's
# "start with the copy-paste-ready read-only step", article p.41). Dispatch only: it never
# runs on its own. It installs the pinned Claude Code CLI and runs .github/scripts/
# substrate_smoke.py, which takes whichever repository secret exists — ANTHROPIC_API_KEY
# (bare mode, billed per token; preferred when both are set) or CLAUDE_CODE_OAUTH_TOKEN (the
# owner's subscription) — runs one headless turn under a per-run budget, and prints the cost
# and the model the CLI reports. Facts and quotes behind every flag are in docs/NOTES.md sections 2 and 10b.
name: Substrate smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # the npm package requires Node.js 22 or later (setup docs)

      - name: Install the pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.278

      - name: One headless turn, reported
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 .github/scripts/substrate_smoke.py
