# The daily review-queue digest (no phase run, no model call).
#
# Contract: docs/OPERATING_MODEL.md sections 4.2 and 7 ("a scheduled job posts a daily digest
# of the queue. Nothing pushes to the owner"), build guide step 30, article p.39-41. Installed
# into this project by /sdlc-init from the framework's template/.github/workflows/.
#
# Token rule: events caused by this workflow's GITHUB_TOKEN never start another workflow run
# - only workflow_dispatch and repository_dispatch do. This workflow starts nothing; it edits
# the body of one long-lived issue, which sends no notification. It holds no deploy secret
# and needs no model credential.
#
# Schedule note: cron is UTC, runs on the default branch, and an off-the-hour minute is less
# delayed than :00. GitHub disables schedules in a public repository after 60 days without
# activity; the workflow_dispatch trigger is how the owner re-enables it.
#
# /sdlc-init filled in the framework repository. The Claude Code version is read from
# sdlc.yaml at run time.
name: SDLC review-queue digest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: "sdlc-digest"
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml
        id: pin
        env:
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .github/scripts/sdlc_pin.py --ref "origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@v5
        with:
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Post the digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python framework/plugin/pr/digest.py --repo "$REPO"
