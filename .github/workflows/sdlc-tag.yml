# Tag each plugin release on the default branch (framework repository only; not a template).
#
# The owner tags nothing by hand any more: a merge to main that changes the version in
# .claude-plugin/plugin.json gets the tag v<version> on that merge commit, created once and
# never moved, and a GitHub Release page named after it with generated notes
# (.github/scripts/sdlc_tag.py). Projects pin the framework by the tag (sdlc.yaml:
# plugin.version -> ref=v<version> in their workflows), so the tag must exist before a
# project bumps its pin; the release page is for people.
#
# Token rule: a tag pushed with this workflow's GITHUB_TOKEN starts no other workflow run,
# which is what a release tag needs. The job needs contents: write and nothing else.
#
# Only the default branch is tagged: a workflow_dispatch started from any other ref ends
# green with "not the default branch" and nothing tagged (the script reads GITHUB_REF_NAME
# and SDLC_DEFAULT_BRANCH below), because a tag is created once and never moved.
name: SDLC release tag

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sdlc-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag v<version> from .claude-plugin/plugin.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Create the tag and its release page when they do not exist yet
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/sdlc_tag.py
      - name: Report
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CREATED: ${{ steps.tag.outputs.created }}
          RELEASE: ${{ steps.tag.outputs.release }}
          SKIPPED: ${{ steps.tag.outputs.skipped }}
        run: python3 -c "import os; print(os.environ['TAG'], 'created=' + os.environ['CREATED'], 'release=' + os.environ['RELEASE'], os.environ['SKIPPED'])"
