# This repository's own checks (the 1.0.0 readiness review of 2026-09-26, group C): the lint
# and the whole test suite, `python tasks.py verify`, on the two platforms the framework runs
# on. Not a template: a project gets sdlc-*.yml from the template; this workflow tests the
# plugin, the template and the hooks themselves. The Windows job is the only Windows run of
# the suite (the owner's PC last ran it under 657 tests, session 4): the console-encoding
# fixes of 0.2.25, the `.cmd` launchers and every path comparison are checked there, and a
# red Windows job on a pull request is a defect of the change, not of the runner: the dev
# tools are bounded to the versions whose lint and format rules are fixed (pyproject's dev
# extra), so a tool release cannot turn every pull request red on its own. The third job is
# the oldest Python the framework supports (pyproject's requires-python): the branches the
# code keeps for it run nowhere else. The Windows job always runs on main and on dispatch;
# on a pull request it is skipped when every changed path is documentation (the platforms
# job below), and reports the check as skipped. Since 2026-10-19 the Windows suite runs in
# three shards on parallel runners, and the check `check (windows-latest, 3.12)` is their
# verdict (the two jobs at the end). Every test job first prepares its runner: git's automatic
# maintenance off, and Defender's real-time scan off on Windows
# (.github/scripts/framework_checks_runner.py; speed only, never a red step).
#
# Every `run:` line calls python (CLAUDE.md: no shell scripts); the runner's default shell
# is bash on Linux and pwsh on Windows, and both take these lines as written. Nothing is
# committed and nobody is notified; the job's verdict is the check on the pull request.
name: Framework checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's runs are keyed by its number, not its head ref (two forks' branches of
  # one name never cancel each other; the review of the 0.2.28 diff), and a new push cancels
  # the run it supersedes. Every other run (a push to main, a dispatch) is keyed by its
  # commit and never cancelled: a merge used to cancel the run of the merge before it, so
  # the suite never finished on some main commits, one of them the commit v0.3.6 names
  # (run #279; the batch ci revision, 10.1). Keying by commit, not by ref, matters too: a
  # group holds one pending run, and a third merge would replace the second's pending run.
  group: "framework-checks-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the Windows job runs: on a pull request only when a changed path is not
  # documentation (docs/**, HANDOFF.md, README.md); on main and on dispatch always
  # (.github/scripts/framework_checks_windows.py; the batch ci revision, 10.2).
  platforms:
    name: Pick the platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.pick.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Run Windows unless every changed path is documentation
        id: pick
        run: python3 .github/scripts/framework_checks_windows.py

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Prepare the runner (git's automatic maintenance off; Defender's real-time scan too on Windows)
        run: python .github/scripts/framework_checks_runner.py

      - name: Install the dev tools (pyproject's dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Build, lint, docs lint and test (python tasks.py verify; choice 253)
        run: python tasks.py verify

  # The Windows suite in three shards on parallel runners (2026-10-19): the one Windows job
  # had grown to 20-23 minutes against 3 on Linux. Each shard runs `python tasks.py verify`
  # with FRAMEWORK_TEST_SHARD set, and tests/conftest.py keeps the tests whose id hashes to
  # it, so every test still runs on Windows exactly once. Same `if:` as the job below.
  check-windows-shard:
    name: check (windows-latest, 3.12, shard ${{ matrix.shard }}/3)
    needs: platforms
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.platforms.outputs.windows != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare the runner (git's automatic maintenance off; Defender's real-time scan too on Windows)
        run: python .github/scripts/framework_checks_runner.py

      - name: Install the dev tools (pyproject's dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Build, lint, docs lint and test (python tasks.py verify; choice 253)
        env:
          FRAMEWORK_TEST_SHARD: ${{ matrix.shard }}/3
        run: python tasks.py verify

  # The check the Windows job always reported, kept under its name: green only when every
  # shard is green. A job of its own, not a matrix entry, so that a skip reports the check as
  # skipped instead of leaving it out. It runs when the pick failed too (its output is then
  # empty, never 'false'), and never on a cancelled run; a red or skipped shard on an event
  # that runs Windows makes it red. It only reads the shards' result, so it runs on Linux.
  check-windows:
    name: check (windows-latest, 3.12)
    needs: [platforms, check-windows-shard]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.platforms.outputs.windows != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows shard passed
        env:
          SHARDS: ${{ needs.check-windows-shard.result }}
        run: python3 -c "import os, sys; r = os.environ['SHARDS']; print('shards:', r); sys.exit(r != 'success')"
