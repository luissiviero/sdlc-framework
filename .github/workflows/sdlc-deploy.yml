# Phase (e) deploy, fired by the test job's dispatch, or by the owner's sdlc:d-approved label (Full).
#
# Contract: docs/OPERATING_MODEL.md section 4.2 (the trigger and dispatch table), build guide
# step 30, article p.39-41 ("Run Claude Code non-interactively inside the CI/CD pipeline,
# sandbox the execution"). Installed into this project by /sdlc-init from the framework's
# template/.github/workflows/; edit it here, not in the framework.
#
# Token rule (decision 33): with the repository variable SDLC_APP_ID set, the job pushes and
# opens pull requests with the project's GitHub App token, and the events the App causes do
# start workflow runs - the project's CI runs on its heads with no approval click. Without it
# the job falls back to the workflow token, whose events never start another workflow run -
# only workflow_dispatch and repository_dispatch do. The owner's merges and labels fire these
# workflows normally; every automated transition stays an explicit workflow_dispatch that
# run_phase.py sends with the change id, which the fallback needs. The App's private key
# reaches the mint step only. The job holds no deploy secret and no production credential
# (article p.40).
#
# /sdlc-init filled in the framework repository. The Claude Code version is read from
# sdlc.yaml at run time.
name: SDLC deploy (e)

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: "Four-digit change id, e.g. 0001"
        required: true
        type: string
      head_ref:
        description: "The change's work branch, e.g. sdlc/0001/c; it keys the concurrency group"
        required: false
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: write

# One change at a time, keyed on the change's own branch: sdlc/<id>/b for the design PR
# merge, sdlc/<id>/c for build, test and deploy — the runs that must serialise
# (OPERATING_MODEL section 4.2). run_phase.py passes head_ref on every dispatch, so an
# automated hop lands in the same group as the PR-fired run of the same branch. The group
# is set on the job below.
jobs:
  deploy:
    # Only the gate (d) approval label starts this workflow from a PR event, and never when a
    # [bot] applied it (R49: the App's own labels start workflows); run_phase.py also checks
    # that a human, not the automation, applied it. The review pass and phase (e) are two
    # steps of one job, in that order.
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.label.name == 'sdlc:d-approved' &&
      !endsWith(github.event.sender.login, '[bot]')) }}
    # 1.0.3 (decision 29): the group is the job's, not the workflow's, so an event whose job
    # is skipped by the condition above (a comment-only review, another label) never enters
    # it and cannot cancel a pending run - the automatic fix round the runner dispatched
    # among them. Job and workflow groups of one name are one group in the repository.
    concurrency:
      group: "sdlc-${{ inputs.head_ref || github.event.pull_request.head.ref }}"
      cancel-in-progress: false
    outputs:
      change_id: ${{ inputs.change_id }}
      head_ref: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
    runs-on: ubuntu-latest
    # 0.3.0: the session's wall clock (gate.max_wall_clock_minutes, 120 by default, plus
    # 5 of grace) and then the gate's commands step, which runs the three targets after
    # the session at gate.command_timeout each (900 s by default): 125 + 50 minutes;
    # 1.0.3 (decision 29): + 10 for the judge at the iteration cap
    timeout-minutes: 200
    steps:
      # Decision 33: the automation pushes and opens pull requests as the project's GitHub
      # App. Without the repository variable SDLC_APP_ID this step is skipped and every step
      # below falls back to the workflow token. The private key is read here only.
      - name: Mint the App token (decision 33; skipped without vars.SDLC_APP_ID)
        id: app
        if: ${{ vars.SDLC_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          # no more than this job's permissions: block grants the workflow token
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: write
          permission-actions: write

      # The token expires an hour after it is minted (the action's README); past 50
      # minutes the runner publishes with the workflow token instead (ci/app_token.py),
      # counted from this time.
      - name: Record when the App token was minted
        if: steps.app.outcome == 'success'
        run: python -c "import os, time; f = open(os.environ['GITHUB_ENV'], 'a'); f.write('SDLC_APP_TOKEN_MINTED_AT=%d\n' % time.time()); f.close()"

      - name: Check out the project
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml, with its script
        id: pin
        env:
          # a scheduled run's event payload may carry no repository (not verified live,
          # NOTES section 16): there the checked-out ref is the default branch
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: git show "refs/remotes/origin/$SDLC_DEFAULT_BRANCH:.github/scripts/sdlc_pin.py" | python - --ref "refs/remotes/origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The version comes from the pin step at run time, so a bump in sdlc.yaml applies on
      # the next run; re-install the workflows only when this file itself changes.
      - name: Install the pinned Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pin.outputs.claude_code }}
        run: npm install -g @anthropic-ai/claude-code@"$CLAUDE_CODE_VERSION"

      - name: Prepare the runner for Claude Code's sandbox
        run: python framework/plugin/ci/runner_setup.py

      - name: "Install the project's own toolchain (sdlc.yaml: commands.setup)"
        run: python framework/plugin/ci/project_setup.py --root .

      - name: Review pass in a fresh context (read-only but for the findings file)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ inputs.change_id }}
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase review --id "$CHANGE_ID" --head-ref "$HEAD_REF" --repo "$REPO" --ref "$DEFAULT_BRANCH"

      # The review pass ran a session holding Write and Bash(git *) in this same checkout
      # (the review of the 0.2.26 diff, M4): the framework checkout it could reach is
      # removed and checked out afresh at the pin the first step read (a step output lives
      # in the runner), then the project checkout's remote, refspec and config are verified
      # from that fresh copy and the default branch fetched again by URL; anything else
      # ends the job red here (plugin 0.2.27; plugin/ci/checkout_check.py).
      - name: Remove the framework checkout the session could reach
        run: python -c "import shutil; shutil.rmtree('framework', ignore_errors=True)"

      - name: Check out the pinned framework afresh (public repository, no token)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Verify the project checkout before the next step
        env:
          PIN_REF: ${{ steps.pin.outputs.ref }}
          # R49: the fetch's credential, in its environment only (ci/app_token.py
          # git_auth_env): the App's token while fresh, else the workflow token
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}
          FRAMEWORK_URL: ${{ github.server_url }}/luissiviero/sdlc-framework
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: python framework/plugin/ci/checkout_check.py --root . --framework framework --pin-ref "$PIN_REF" --origin "$ORIGIN_URL" --framework-origin "$FRAMEWORK_URL"

      - name: Run phase (e)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SDLC_WORKFLOW_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ inputs.change_id }}
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python framework/plugin/ci/run_phase.py --root . --plugin-dir framework --phase e --id "$CHANGE_ID" --head-ref "$HEAD_REF" --repo "$REPO" --ref "$DEFAULT_BRANCH"

      # Build guide step 41.1 (article p.39): every hook decision of the run is one line of
      # changes/<id>-<slug>/evidence/hook-log.jsonl (committed with the evidence) or of
      # changes/.hook-log.jsonl; the artifact keeps them readable when a run never committed.
      - name: Keep the hook log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-hook-log-${{ github.run_id }}
          path: |
            changes/**/evidence/hook-log.jsonl
            changes/.hook-log.jsonl
          if-no-files-found: ignore

  # ROADMAP R8 (plugin 1.0.18): a second opinion on the build from a model of another vendor,
  # advisory. Off unless the default branch's sdlc.yaml lists (e) under
  # external_review.phases. A job of its own on a fresh runner after the deploy job: the
  # Claude session never held the Gemini key and never shared this machine, and the key
  # reaches only the one step that calls the API. The step reads the PR's head from git
  # (never the session's working tree), posts one comment on the PR as the workflow token
  # (a fix round never applies a bot's comment) and never fails: a failed call is "not run".
  second-opinion:
    needs: deploy
    if: ${{ needs.deploy.outputs.change_id != '' || needs.deploy.outputs.head_ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write  # a PR comment goes through the issues endpoint
    steps:
      - name: Check out the project
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the framework pin from the default branch's sdlc.yaml, with its script
        id: pin
        env:
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        shell: bash
        run: git show "refs/remotes/origin/$SDLC_DEFAULT_BRANCH:.github/scripts/sdlc_pin.py" | python - --ref "refs/remotes/origin/$SDLC_DEFAULT_BRANCH"

      - name: Check out the pinned framework (public repository, no token)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          repository: "luissiviero/sdlc-framework"
          ref: ${{ steps.pin.outputs.ref }}
          path: framework

      - name: Second opinion on the build (advisory; never fails the job)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ needs.deploy.outputs.change_id }}
          HEAD_REF: ${{ needs.deploy.outputs.head_ref }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: python framework/plugin/external/cli.py review --root . --id "$CHANGE_ID" --head-ref "$HEAD_REF" --phase e --repo "$REPO" --ref "$DEFAULT_BRANCH" --post --out second-opinion.json

      - name: Keep the second opinion's record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-second-opinion-${{ github.run_id }}
          path: second-opinion.json
          if-no-files-found: ignore
