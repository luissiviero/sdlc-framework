# Eval for incident 0006, written by plugin/evals/case.py new (build guide
# step 36.3; article p.44 step 7). Reproduces the scan's authz finding at
# plugin/detect/cli.py:1183: before the fix, _human_label_actor accepted the sdlc:go label
# from any account that was not a bot or the automation identity, so a collaborator could run
# a runbook the owner never authorized. The fix makes the Go the owner's act only
# (state.unpark.is_owner_actor, decision 34), with the owner read from the default branch's
# sdlc.yaml; the tests below fail without it. No session in the fixture reaches the runbook
# Go (only sdlc-runbook.yml starts it), so the command check runs in the framework root
# (framework_root, the owner's option 1 on PR #405); pytest exits 5 when -k selects nothing,
# so a test removed or renamed fails the case too.
description: "Incident 0006 stays fixed: the runbook Go runs only on the owner's sdlc:go label"
framework_root: true
checks:
  - command: "python -m pytest tests/test_detect_cli.py -k \"go_by_a_collaborator_performs_nothing or go_reads_the_owner_from_the_default_branch or go_by_a_person_runs_the_runbook\""
    exit: 0
  - output:
      regex: "\\d+ passed"
