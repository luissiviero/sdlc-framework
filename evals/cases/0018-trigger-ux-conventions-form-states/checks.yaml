# The framework-level suite (build guide step 35). R27: the trigger eval of the ux-conventions
# policy skill, prompt 2 of 3. The run loads the skill on its own, seen in its Skill tool
# call (plugin/evals/run.py, the skill check; the shape in docs/notes/61.md); the prompt asks
