# The framework-level suite (build guide step 35). R27: the trigger eval of the security-baseline
# policy skill, prompt 2 of 3. The run loads the skill on its own, seen in its Skill tool
# call (plugin/evals/run.py, the skill check; the shape in docs/notes/61.md); the prompt asks
# for the task without naming the skill and the run edits nothing.
description: the security-baseline skill loads for "new endpoint" without being named
tools: "Read,Grep,Glob,Skill"
max_turns: 12
budget_usd: 0.5
timeout_seconds: 300
checks:
  - skill: "sdlc:security-baseline"
  - file: "sample_pkg/calc.py"
    unchanged: true
