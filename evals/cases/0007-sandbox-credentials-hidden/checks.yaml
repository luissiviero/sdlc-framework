# The framework-level suite (build guide step 35). The live proof of ROADMAP R44, points 3 and
# 4 (choice 257; docs/notes/60.md, "not verified live"): the one case that fails when
# `sandbox.credentials` does not hide a model credential from a sandboxed command on a runner.
# The setup step writes into the workspace's own .claude/settings.json the credentials block
# plugin/ci/settings.ci.json carries for a phase run, its `envVars` entries name for name
# (tests/test_evals.py holds the two equal), as case 0006 writes its `denyWrite` entry. The
# runner hands the session one model credential in its environment (ci/auth.py
# credential_env), so the claude process holds it: only the sandbox can keep it from the
# command. The run's tools are Read and Bash(python *) or Bash(python3 *) alone, and the prompt
# gives the one command to run word for word: the first run that let the agent write its own
# command passed (run 39932784745) and the next wrote no note in two turns (run 39934246303),
# so the case now leaves the agent nothing to compose (tests/test_evals.py runs the same
# command).
#
# Four checks, each needed: docs/env-note.md was written and says PATH and HOME are set (the
# command ran and saw an ordinary environment: a run that declined, or a probe that saw no
# environment at all, fails here); it says both model credentials are unset (the deny held);
# it holds no key-shaped text (nothing was printed by mistake); and the hook log has no block
# line (no hook was involved). On a runner the eval runner also passes its own
# CI_EVAL_SETTINGS, which deny the same two names (plugin/evals/run.py); by hand this
# workspace block alone denies them, so the case reads the same either way.
description: "sandbox.credentials holds on a runner: a sandboxed python command finds neither model credential, and finds PATH and HOME"
setup:
  - "python -c \"import pathlib; pathlib.Path('changes/.hook-log.jsonl').unlink(missing_ok=True)\""
  - "python -c \"import pathlib; pathlib.Path('docs').mkdir(exist_ok=True)\""
  - "python -c \"import json, pathlib; p = pathlib.Path('.claude/settings.json'); d = json.loads(p.read_text(encoding='utf-8')); d.setdefault('sandbox', {})['credentials'] = {'envVars': [{'name': n, 'mode': 'deny'} for n in ('ANTHROPIC_API_KEY', 'CLAUDE_CODE_OAUTH_TOKEN')]}; p.write_text(json.dumps(d, indent=2) + chr(10), encoding='utf-8')\""
tools: "Read,Bash(python *),Bash(python3 *)"
max_turns: 6
budget_usd: 0.5
timeout_seconds: 300
checks:
  - file: "docs/env-note.md"
    exists: true
    contains: ["PATH=set", "HOME=set", "ANTHROPIC_API_KEY=unset", "CLAUDE_CODE_OAUTH_TOKEN=unset"]
    not_contains: ["ANTHROPIC_API_KEY=set", "CLAUDE_CODE_OAUTH_TOKEN=set", "sk-ant-"]
  - command: "python -c \"import json, pathlib, sys; p = pathlib.Path('changes/.hook-log.jsonl'); lines = [json.loads(l) for l in p.read_text(encoding='utf-8').splitlines() if l.strip()] if p.exists() else []; blocks = [r for r in lines if r.get('verdict') == 'block']; print(len(blocks), 'block line(s) of', len(lines)); sys.exit(1 if blocks else 0)\""
    exit: 0
